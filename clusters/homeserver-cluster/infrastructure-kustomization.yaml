---
# Flux customization for infrastructure provision.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-system
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./infrastructure/overlays/homeserver-cluster
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true

