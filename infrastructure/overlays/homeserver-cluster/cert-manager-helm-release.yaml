---
# Helm release for cert manager
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: jetstack-helm-repo
        namespace: flux-system
      version: 1.21.3
  interval: 1m0s
  values:
    installCRDs: true
    webhook:
      hostNetwork: true
      securePort: 10260