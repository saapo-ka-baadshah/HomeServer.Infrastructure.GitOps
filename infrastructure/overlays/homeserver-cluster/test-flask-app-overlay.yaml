---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: test-flask-app
resources:
  - ../../apps/test-flask-app.yaml
patches:
  - target:
      kind: HelmRelease
      name: testapi-release
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: testapi-release
      $patch: delete

