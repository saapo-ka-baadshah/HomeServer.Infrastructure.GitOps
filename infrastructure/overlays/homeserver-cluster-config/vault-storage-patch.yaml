---
# Hashicorp vault helm release
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hashicorp-vault-release
  namespace: flux-system
spec:
  values:
    global:
      tlsDisable: false
    server:
      extraEnvironmentVars:
        VAULT_CACERT: /vault/tls/ca.crt
        VAULT_TLSCERT: /vault/tls/tls.crt
        VAULT_TLSKEY: /vault/tls/tls.key
      dataStorage:
        storageClass: local-path
      volumes:
        - name: vault-tls
          secret:
            defaultMode: 420
            secretName: vault-cert-secret
      volumeMounts:
        - name: vault-tls
          mountPath: /vault/tls
          readOnly: true
      standalone:
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 0
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file = "/vault/tls/tls.crt"
            tls_key_file = "/vault/tls/tls.key"
            tls_client_ca_file = "/vault/tls/ca.crt"
          }
          storage "file" {
            path = "/vault/data"
          }
    injector:
      affinity: |
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vault-agent-injector
                    app.kubernetes.io/instance: vault-hashicorp-vault-release
                    component: webhook
                topologyKey: kubernetes.io/hostname
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1