apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/local-path-provisioner//deploy?ref=v0.0.32
patches:
  - path: local-path-patch.yaml
    target:
      group: storage.k8s.io
      version: v1
      kind: StorageClass
      name: local-path
  - path: kc-storageclass.yaml
    target:
      group: storage.k8s.io
      version: v1
      kind: StorageClass
      name: kc-local-path
  - path: freeipa-storageclass.yaml
    target:
      group: storage.k8s.io
      version: v1
      kind: StorageClass
      name: freeipa-local-path
