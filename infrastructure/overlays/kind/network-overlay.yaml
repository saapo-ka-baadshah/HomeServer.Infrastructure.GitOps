# Removes some of the resources as a local development kind cluster
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: network-overlay
resources:
  - ../../controllers
patches:
  - target:
      kind: Gateway
      name: homecluster-gateway
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: homecluster-gateway
      $patch: delete
  - target:
      kind: IPAddressPool 
      name: default-pool
    patch: |-
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
      $patch: delete
  - target:
      kind: L2Advertisement 
      name: default-l2
    patch: |-
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
      $patch: delete

