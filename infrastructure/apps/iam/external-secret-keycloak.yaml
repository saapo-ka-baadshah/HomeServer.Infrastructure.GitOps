---
# External secret for my keycloak application
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-credentials
  namespace: iam
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: iam-vault-eso-secretstore
    kind: SecretStore
  target:
    name: keycloak-credentials-secret
  data:
    - secretKey: kc_user
      remoteRef:
        key: "apps/keycloak"
        property: "KEYCLOAK_ADMIN_USER"