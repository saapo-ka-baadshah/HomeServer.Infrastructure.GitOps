---
# Vault store restricted to the iam namespace.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: iam-vault-eso-secretstore
spec:
  conditions:
    - namespaces:
        - iam
  provider:
    vault:
      server: "https://vault-hashicorp-vault-release.vault.svc.cluster.local:8200"
      path: "kv/homelab"
      version: v2
      namespace: "vault"
      caProvider:
        type: Secret
        name: vault-ca-secret
        namespace: vault
        key: tls.crt
      auth:
        kubernetes:
          mountPath: "kubernetes/eso-keycloak"
          role: "eso-vault-auth"
          serviceAccountRef:
            name: "eso-vault-auth"
            namespace: iam