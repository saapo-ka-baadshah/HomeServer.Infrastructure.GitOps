---
# External secret store for the iam namespace.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: iam-vault-eso-secretstore
  namespace: iam
spec:
  provider:
    vault:
      server: "https://vault-hashicorp-vault-release.vault.svc.cluster.local:8200"
      path: "kv/homelab"
      version: v2
      namespace: "vault"
      caProvider:
        type: Secret
        name: vault-ca-secret
        key: tls.crt
      auth:
        kubernetes:
          mountPath: "kubernetes/eso-keycloak"
          role: "eso-vault-auth"
          serviceAccountRef:
            name: "eso-vault-auth"