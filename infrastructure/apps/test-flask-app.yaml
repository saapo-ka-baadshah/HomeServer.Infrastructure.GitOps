---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: testapi-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: flask-test-api
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: home-infra-helm-repo
        namespace: flux-system
      version: 0.1.0
  interval: 1m0s
  storageNamespace: application
  targetNamespace: application
  values:
    imagePullSecret:
      -name: ghcr-auth
