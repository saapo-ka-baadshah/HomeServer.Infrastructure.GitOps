---
# TLS route for hashicorp vault.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: vault-tls-route
  namespace: vault
spec:
  parentRefs:
    - name: vault-gateway
      namespace: vault
      sectionName: vault-tls
  hostnames:
    - vault.hcga.cluster
  rules:
    - backendRefs:
      - name: vault-hashicorp-vault-release
        port: 8200