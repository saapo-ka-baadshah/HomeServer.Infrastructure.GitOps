---
# Dedicated vault certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-certificate
  namespace: vault
spec:
  isCA: false
  commonName: AmeyHomelab.VaultCert
  secretName: vault-cert-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: vault-cert-issuer
    kind: Issuer
    group: cert-manager.io

---
# Helm release specification for HashiCorp Vault Helm chart.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hashicorp-vault-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: vault
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: hashicorp-helm-repo
        namespace: flux-system
      version: 0.34.1
  interval: 1m0s
  storageNamespace: vault
  targetNamespace: vault