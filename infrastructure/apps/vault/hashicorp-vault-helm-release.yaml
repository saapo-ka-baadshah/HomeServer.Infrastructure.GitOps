# Helm release specification for HashiCorp Vault Helm chart.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hashicorp-vault-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: vault
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: hashicorp-helm-repo
        namespace: flux-system
      version: 0.34.1
  interval: 1m0s
  storageNamespace: vault
  targetNamespace: vault