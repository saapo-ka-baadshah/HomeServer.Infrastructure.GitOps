---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-release
  namespace: flux-system
spec:
  chart:
    spec:
      chart: keycloak
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: bitnami-helm-repo
        namespace: flux-system
      version: 25.2.0
  interval: 1m0s
  storageNamespace: iam
  targetNamespace: iam
