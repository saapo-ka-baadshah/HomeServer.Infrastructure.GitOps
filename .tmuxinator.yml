# ./.tmuxinator.yml

name: homeserver.gitops
root: <%== `pwd`.strip %>

windows:
  - editor:
      layout: main-vertical
      panes:
        - editor: nvim
      focused_pane: editor

  - terminal:
      layout: tiled
      panes:
        - clear

  - opencode:
      layout: tiled
      panes:
        - opencode
